<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="humidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="rhDropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="rhDropGradSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="rhGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0ea5e9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Humidor Squircle Base (inset 16px to prevent clipping) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#humidBg)" stroke="#10b981" stroke-width="10" stroke-opacity="0.95"/>
  
  <!-- Subtle Internal Telemetry Horizon -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.18"/>

  <!-- RH% Dual Droplets Motif -->
  <g filter="url(#rhGlow)">
    <!-- Companion Droplet (left) -->
    <path d="M176 348c40.5 0 73.7-33.7 73.7-74.5 0-21.3-10.5-41.6-31.5-58.7S181.3 172.2 176 145.5c-5.3 26.7-21 52.3-42.1 69.3S102.3 252.2 102.3 273.5c0 40.8 33.1 74.5 73.7 74.5z" fill="url(#rhDropGradSmall)"/>
    <path d="M198 255a32 32 0 0 1 3 32" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Primary RH Droplet (right) -->
    <path d="M316 122c-55.3 73.7-101.4 138.2-101.4 202.7 0 56 45.4 101.3 101.4 101.3s101.4-45.3 101.4-101.3c0-64.5-46.1-129-101.4-202.7z" fill="url(#rhDropGrad)"/>
    <!-- Specular Highlight Arc -->
    <path d="M376 270a64 64 0 0 1 4.5 64" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9"/>
  </g>
</svg>